services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: carvalue
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-carvalue_local_only}
      POSTGRES_DB: carvalue
    volumes:
      - postgres_datos:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U carvalue -d carvalue"]
      interval: 5s
      timeout: 3s
      retries: 15

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "5000:5000"
    environment:
      DATABASE_URL: postgresql+psycopg://carvalue:${POSTGRES_PASSWORD:-carvalue_local_only}@db:5432/carvalue
      COHERE_API_KEY: ${COHERE_API_KEY:-}
      VISION_MOCK: ${VISION_MOCK:-1}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./app:/code/app:ro
      - ./templates:/code/templates:ro

  jupyter:
    build:
      context: .
      dockerfile: Dockerfile.jupyter
    ports:
      - "8888:8888"
    environment:
      JUPYTER_TOKEN: ${JUPYTER_TOKEN:-carvalue123}
      DATABASE_URL: postgresql+psycopg://carvalue:${POSTGRES_PASSWORD:-carvalue_local_only}@db:5432/carvalue
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./data:/home/jovyan/work/data:ro
      - ./notebooks:/home/jovyan/work/notebooks

volumes:
  postgres_datos:
