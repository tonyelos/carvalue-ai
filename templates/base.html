<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CarValue AI · Proyecto Big Data I</title>
  <style>
    :root{color-scheme:light;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
    body{margin:0;background:#f4f7fb;color:#17263a;line-height:1.55}
    header{background:#162d49;color:#fff;padding:24px 20px}
    header .wrap{max-width:850px;margin:auto}
    h1{margin:0;font-size:27px;letter-spacing:-.6px}h2{margin-top:0;font-size:21px}
    header p{margin:3px 0 0;color:#ccd8e8}
    nav{margin-top:16px}nav a{color:#fff;text-decoration:none;margin-right:20px;border-bottom:1px solid #7ca7d7}
    main{max-width:850px;margin:26px auto;padding:0 18px}
    .card{background:#fff;border:1px solid #dce4ed;border-radius:14px;padding:26px;box-shadow:0 5px 20px #17304a0b;margin-bottom:20px}
    .grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}
    label{font-weight:600;font-size:14px;display:block;margin-bottom:5px}
    input,select{box-sizing:border-box;width:100%;background:#fff;padding:11px;border:1px solid #bbc9d8;border-radius:8px;font:inherit}
    button,.btn{background:#1f5c98;color:white;border:0;border-radius:9px;padding:11px 17px;font:inherit;font-weight:650;cursor:pointer;display:inline-block;text-decoration:none}
    button:hover,.btn:hover{background:#1a4979}
    .hint{color:#61758d;font-size:13px}.alert{background:#fff1f0;color:#8a2d2a;padding:12px;border-radius:8px;margin:12px 0}
    .value{font-size:38px;font-weight:750;color:#164a7e;letter-spacing:-1px}
    .tag{display:inline-block;background:#e8f1fd;color:#244e79;border-radius:99px;padding:3px 10px;font-size:13px}
    table{width:100%;border-collapse:collapse}td,th{text-align:left;padding:9px 7px;border-bottom:1px solid #dfe6ed;font-size:14px}
    footer{max-width:850px;margin:10px auto 30px;padding:0 18px;color:#667b91;font-size:12px}
    @media(max-width:620px){.grid{grid-template-columns:1fr}.card{padding:18px}.value{font-size:31px}}
  </style>
</head>
<body>
  <header><div class="wrap"><h1>CarValue AI</h1>
  <p>Taller de integración · Proyecto Big Data I</p>
  <nav><a href="/">Tasación</a><a href="/historial">Últimas tasaciones</a></nav>
  </div></header>
  <main>{% block contenido %}{% endblock %}</main>
  <footer>Prototipo académico. Precio orientativo en USD; el análisis visual no es una peritación del vehículo.</footer>
</body>
</html>
